<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <foreignObject x="0" y="0" width="1000" height="250">
    <div xmlns="http://www.w3.org/1999/xhtml" class="banner">
      <style>
        .banner {
          position: relative; width: 1000px; height: 250px; overflow: hidden;
          background: #000; display: grid; place-items: center;
        }
        .banner::before {
          content: ""; position: absolute; inset: 0; pointer-events: none;
          background:
            radial-gradient(240px 80px at 50% 0%,
              rgba(255,255,255,.24) 0%, rgba(255,255,255,.17) 25%, rgba(255,255,255,.09) 50%,
              rgba(255,255,255,.035) 72%, rgba(255,255,255,.008) 88%, transparent 100%),
            radial-gradient(520px 150px at 50% 0%,
              rgba(255,255,255,.06) 0%, rgba(255,255,255,.04) 25%, rgba(255,255,255,.02) 50%,
              rgba(255,255,255,.007) 74%, rgba(255,255,255,.002) 90%, transparent 100%);
        }
        .word {
          position: relative;
          font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace;
          font-size: 96px; font-weight: 500; letter-spacing: -.01em; line-height: 1;
          color: #f5f5f7;
        }
      </style>
      <span class="word">auth-center</span>
    </div>
  </foreignObject>
</svg>
